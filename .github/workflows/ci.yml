name: source-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MineDeck
        shell: pwsh
        run: |
          dotnet build MineDeck\src\MineDeck\MineDeck.csproj --configuration Release
          dotnet run --project MineDeck\tests\MineDeck.Tests\MineDeck.Tests.csproj --configuration Release
      - name: MineScape Bridge and Client
        shell: pwsh
        run: MineScape\gradlew.bat --no-daemon -p MineScape test build
      - name: MineJammer
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path MineJammer).Path
          python -m unittest discover -s MineJammer\tests -v
